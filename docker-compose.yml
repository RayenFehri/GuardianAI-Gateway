version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: gateway_postgres
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: gateway_admin
      POSTGRES_PASSWORD: changeme123
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gateway_mosquitto
    ports:
      - "1883:1883"
    command: sh -c "echo 'listener 1883' > /tmp/m.conf && echo 'allow_anonymous true' >> /tmp/m.conf && mosquitto -c /tmp/m.conf"

  grafana:
    image: grafana/grafana:latest
    container_name: gateway_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: guardian123
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pg_data:
  grafana_data:
